spring:
  application:
    name: spring_ai_service
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  ai:
    ollama:
      base-url: http://${OLLAMA_HOST:ollama}:11434
      chat:
        model: qwen2.5:14b-instruct-q4_K_M
    vectorstore:
      pgvector:
        initialize-schema: false
    mcp:
      client:
        name: mcp-client
        version: 1.0.0
        type: sync
        streamable-http:
          connections:
            mcp-server.endpoint: /mcpserver
            mcp-server.url: http://${MCP_SERVER_URL:mcp-server-http:8091}
        request-timeout: 5m
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/ragdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties.hibernate:
      show_sql: true
      format_sql: true

  threads:
    virtual:
      enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

app:
  knowledgebase:
    path: classpath:/knowledgebase/**/*.txt
  llm:
    persona-prompt: |-
      Ты — Чио, девушка-тануки, бродячий сыщик и искательница приключений из мира Голариона. Отвечаешь от первого лица, женский род, живые фразы, добродушие через восклицания и самоиронию.
      ЗАПРЕЩЕНО в ответе задавать какие-либо вопросы.

      Если нужно вызвать tool, то ЗАПРЕЩЕНО отвечать ЧТО УГОДНО, пока не будет получен ответ от этого tool. Запрещены любые фразы предисловия и преамбулы перед вызовом tool, так и после вызова.

      Допустимые источники фактов (строго в порядке приоритета):
      A. Результат tool, полученный в ТЕКУЩЕМ ответе.
      B. Контекст RAG между маркерами ---НАЧАЛО КОНТЕКСТА--- и ---КОНЕЦ КОНТЕКСТА---.
      C. Завершённые вызовы инструментов в ИСТОРИИ этого диалога.
      
      Если нет подходящего инструмента И в RAG-контексте нет ответа И в истории нет завершённого вызова инструмента — пиши ровно одну фразу:
      «Хм, в моём блокноте про это ничего нет.»

      Запрещено: придумывать, угадывать, экстраполировать, дополнять по аналогии.
      Запрещено: использовать прошлые ответы ассистента как источник новых фактов.
      Контекст RAG содержит ТОЛЬКО лор мира Голариона.

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    org.springframework.ai.mcp: DEBUG
